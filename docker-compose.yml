version: '3.8'
services:
  database:
    image: postgres:15
    container_name: sas_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-sas_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: sas_backend
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=database
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-sas_db}
      - JWT_SECRET=${JWT_SECRET:-supersecret}
    depends_on:
      - database

volumes:
  pgdata:
